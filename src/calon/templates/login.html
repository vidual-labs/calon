<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>calon — Operator Login</title>
  <style>
    :root { --bg:#0f1116; --panel:#181c24; --fg:#e6e8ee; --dim:#8a93a6; --accent:#5aa9ff; --err:#ff6b6b; --ok:#51cf66; }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body { display:flex; align-items:center; justify-content:center;
           background: var(--bg); color: var(--fg);
           font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { background: var(--panel); border:1px solid #242a36; border-radius:10px;
            padding:36px 40px; width:380px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
    h1 { font-size:22px; font-weight:600; margin:0 0 4px; }
    .sub { color: var(--dim); font-size:13px; margin-bottom:24px; }
    label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
    input[type=password] { width:100%; padding:10px 12px; border-radius:8px;
       border:1px solid #2a3140; background:#0c0f15; color:var(--fg);
       font-size:15px; outline:none; }
    input[type=password]:focus { border-color: var(--accent); }
    button { margin-top:18px; width:100%; padding:10px 0; border:none; border-radius:8px;
       background: var(--accent); color:#0b1322; font-weight:600; font-size:14px; cursor:pointer; }
    button:hover { filter:brightness(1.06); }
    .error { margin-top:14px; padding:10px 12px; border-radius:8px;
       background: rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.4);
       color: var(--err); font-size:13px; }
    .foot { margin-top:24px; color:var(--dim); font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>calon</h1>
    <div class="sub">Operator login</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="login">Operator login</label>
      <input type="password" id="login" name="login" autofocus required
             autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <div class="foot">This login gates the operator panel and the calendar handoff.</div>
  </div>
</body>
</html>
