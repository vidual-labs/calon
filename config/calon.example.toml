# ---------------------------------------------------------------------------
# calon operator configuration
#
# Copy this file to config/calon.toml and edit it. calon reads it at startup;
# restart the service after changing it.
#
# This file is the source of truth for scheduling rules. There is no admin UI
# in the MVP, which is deliberate: no admin UI means no login, no sessions, and
# no password storage anywhere in calon. It also means your rules are a plain
# text file you can diff, review, and keep in a private repository.
#
# config/calon.toml is git-ignored, because the [sources] section holds shared
# secrets. Never commit it.
# ---------------------------------------------------------------------------

[instance]
# Shown on the public booking form.
name = "calon"

# Fallback display timezone for the UI. Individual resources set their own.
# Must be an IANA timezone name (e.g. "Europe/Berlin", not "CET").
timezone = "Europe/Berlin"


# ---------------------------------------------------------------------------
# The bookable resource — a person, a room, a service.
#
# The MVP ships with exactly one. The data model carries a resource reference
# everywhere, so supporting several later is a data change rather than a
# refactor. This is NOT multi-tenancy: there are no accounts and no isolation
# boundary between resources.
# ---------------------------------------------------------------------------
[resource]
slug = "default"
name = "Consultation"

# The timezone the rules below are expressed in. All the hours, weekdays, and
# blackout dates in this file are interpreted in THIS timezone, regardless of
# where the requester is. calon converts to UTC internally and back to the
# requester's timezone for display.
timezone = "Europe/Berlin"


# ---------------------------------------------------------------------------
# Availability rules
#
# Evaluated as an ordered chain. The first rule a request fails determines the
# decision code it is rejected with; all violations are still reported.
# ---------------------------------------------------------------------------
[availability]

# Days bookings may start on. 0 = Monday … 6 = Sunday.
allowed_weekdays = [0, 1, 2, 3, 4]

# The daily booking window, in the resource timezone, 24-hour "HH:MM".
# A booking must start AND end inside this window; a request that would run
# past window_end is rejected rather than truncated.
window_start = "09:00"
window_end   = "17:00"

# Duration applied when a request does not specify an end time, in minutes.
default_duration_min = 30

# Candidate start times are aligned to this grid, in minutes. Also the step
# used when searching for the next available slot to suggest.
slot_granularity_min = 15

# How far in advance a booking must be made, in minutes. A request for a slot
# sooner than this is rejected with BELOW_MIN_NOTICE.
# 120 = two hours' notice.
min_notice_min = 120

# How far into the future bookings are accepted, in days. Beyond this, a
# request is rejected with BEYOND_MAX_ADVANCE.
max_advance_days = 60

# Protected time around every booking, in minutes. Buffers do not appear in the
# calendar event — they only widen the span used for conflict detection, so
# back-to-back bookings cannot be squeezed together.
buffer_before_min = 0
buffer_after_min  = 15

# Optional cap on accepted bookings per calendar day. Comment out for no limit.
# max_bookings_per_day = 8


# ---------------------------------------------------------------------------
# Blackout periods — holidays, leave, or any time that is closed regardless of
# the rules above. Dates and times are in the resource timezone.
#
# Use `date` for a whole day, or `start`/`end` for part of one.
# ---------------------------------------------------------------------------
[[blackout]]
date = "2026-12-24"
reason = "Christmas Eve"

[[blackout]]
date = "2026-12-25"
reason = "Christmas Day"

[[blackout]]
start = "2026-12-31T12:00:00"
end   = "2026-12-31T23:59:59"
reason = "New Year's Eve, afternoon only"


# ---------------------------------------------------------------------------
# The calendar handoff shown to a requester once a booking is accepted.
#
# calon does not write to anyone's calendar. It produces an .ics file that
# every major calendar accepts, plus one-click deeplinks for Google Calendar
# and Outlook / Microsoft 365 as a convenience.
# ---------------------------------------------------------------------------
[calendar]
event_title = "Consultation with {requester_name}"
location = ""

# Optional ORGANIZER on the generated event. Leave the email empty to omit it.
organizer_name = ""
organizer_email = ""


# ---------------------------------------------------------------------------
# External intake sources (optional, and off by default).
#
# calon is standalone first: it is fully usable with this whole section absent.
# Enabling a source lets an external system POST booking requests to
# /api/v1/<slug>. A source adapter translates that system's payload into
# calon's canonical booking intent — and that is all it does. Adapters never
# make scheduling decisions; every request, native or external, is judged by
# the same rules above.
#
# `secret` is a shared secret used to verify the HMAC-SHA256 signature of each
# incoming request. Generate one with: openssl rand -hex 32. Each request must
# carry two headers: X-Calon-Timestamp (integer Unix seconds) and
# X-Calon-Signature (sha256=hex of HMAC-SHA256 over "<timestamp>.<raw body>")).
#
# `resource_slug` names the [resource] the source books against. One resource
# per deployment is the MVP shape; this key exists so the data model can grow
# a second resource without rewriting every adapter. (Not multi-tenancy.)
#
# `timestamp_window_seconds` is how far in the past (or future) a request's
# X-Calon-Timestamp may be before the verifier rejects it with 401. It is the
# freshness bound on the timestamp; the anti-replay property (a request
# cannot be retried to change an existing outcome) is carried by the
# Idempotency-Key header — a replay returns the stored decision, not a
# re-evaluation (ADR 0012).
#
# OpenFlow below is an EXAMPLE of an external source, not a dependency and not
# a special case. It is the first real provider adapter (0.2.0).
#
# OpenFlow signs its webhook differently from the canonical X-Calon-* scheme:
# it sends ONE header, X-OpenFlow-Signature, the HMAC-SHA256 hex digest of the
# raw JSON body (no timestamp header). The adapter authenticates on that
# signature AND anchors an anti-replay window to the payload's own `timestamp`
# field (a wall clock, not signed over) measured against the instance clock. A
# request that also carries the canonical X-Calon-* headers is verified by the
# standard scheme instead (canonical takes precedence).
#
# Unlike a source that signs the canonical body as-is, an OpenFlow webhook is a
# form submission whose field ids are arbitrary per form. So it needs a per-form
# field-mapping table under `fields.<formId>`: one table per OpenFlow form,
# mapping each of calon's canonical keys (start, end, name, email, phone,
# subject, timezone) to the field id that holds it inside that form's `data`
# object. At least one form must be mapped before the source is enabled (the
# boot refuses to start an enabled openflow source with no field map).
# ---------------------------------------------------------------------------
# [sources.openflow]
# enabled = true
# secret = "replace-me-with-a-long-random-value"
# resource_slug = "default"
# timestamp_window_seconds = 300
#
# # Per-form mapping: one table per OpenFlow formId. `start` is required; the
# # rest are optional. `timezone` is the IANA zone the form's start/end answers are in.
# [sources.openflow.fields."your-openflow-form-id"]
# start = "fld_start_id"
# end = "fld_end_id"
# name = "fld_name_id"
# email = "fld_email_id"
# phone = "fld_phone_id"
# subject = "fld_subject_id"
# timezone = "Europe/Berlin"

# ---------------------------------------------------------------------------
# Resource calendar sync (optional, off by default) — ADR 0009 / 0013 / 0014.
#
# calon is standalone first: with no [calendars] block a resource behaves
# exactly as before — conflicts are checked against calon's own bookings only,
# and the requester still gets the .ics plus the Google/Outlook deeplinks.
#
# To connect a resource's OWN calendar (Google Calendar or Microsoft 365),
# add one [calendars.<resource_slug>] block. The slug must match a [resource]
# slug you already defined (e.g. "default"). When enabled, calon will:
#   * read that calendar's real busy time when checking availability, and
#   * write each accepted booking back to that calendar as an event.
# If the provider is unreachable or errors, that degrades back to
# Calon-only availability for that request — it does NOT fail the booking.
#
# provider       "google" (Google Calendar), "microsoft" (Microsoft 365), or "ics"
#                (a published calendar feed — see the bottom of this section).
# calendar_id    the calendar handle:
#                  google    -> the calendar id (usually the account email,
#                                e.g. "you@example.com") or a secondary-calendar id.
#                  microsoft -> the user the calendar belongs to
#                                (e.g. "you@tenant.onmicrosoft.com"); the
#                                primary calendar of that user is synced.
# enabled        true to turn the connection on for this resource.
# client_id      the OAuth app's client id, from the provider's developer
# client_secret  console (a Google Cloud OAuth client, or an Azure AD app
#                registration). Both are required whenever enabled = true —
#                without them the provider can never refresh an access token,
#                so calon refuses to start rather than silently never syncing.
#                For Google you can skip this whole block instead and enter the
#                same two values in the operator dashboard's Calendars panel,
#                which needs no file edit and no restart (ADR 0016). A block
#                here always wins over what was entered there.
# refresh_token  the OAuth refresh token for this account. For Google, you can
#                leave this blank and instead click "Connect with Google" on
#                the operator dashboard (/admin) after setting client_id/
#                client_secret and restarting — calon runs the OAuth exchange
#                itself and stores the token in calon.db (ADR 0014). For
#                Microsoft 365, or a scripted/headless Google install, paste
#                a refresh token you obtained out-of-band here instead. See
#                "Resource calendar sync" in docs/self-hosting.md for both.
#
# This file is git-ignored and client_secret/refresh_token are secrets — never
# commit your real config/calon.toml. A Google resource connected via the
# dashboard button stores its refresh token in calon.db instead — give that
# file the same care.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# No developer console? Subscribe to a published calendar feed instead
# (ADR 0017). Google Calendar and Outlook both let a user publish a secret
# iCal address from the calendar's own settings, with no app registration and
# no admin rights. calon reads busy time from it, so a clash is rejected the
# same way a connected calendar's would be.
#
# Two differences from the OAuth providers above, both deliberate:
#   * read-only — accepted bookings are NOT written into the calendar; the
#     requester still gets the .ics file and the one-click links.
#   * eventually consistent — providers refresh a published feed on their own
#     schedule, which can lag by hours.
#
# The same URL can be pasted into the operator dashboard instead of here.
# A resource uses either a feed or an OAuth connection, never both.
#
# [calendars.default]
# provider = "ics"
# feed_url = "https://calendar.google.com/calendar/ical/.../basic.ics"
# enabled = true
# ---------------------------------------------------------------------------

# [calendars.default]
# provider = "google"
# calendar_id = "you@example.com"
# enabled = true
# client_id = "replace-me-with-the-oauth2-client-id"
# client_secret = "replace-me-with-the-oauth2-client-secret"
# refresh_token = "replace-me-with-the-oauth2-refresh-token"
